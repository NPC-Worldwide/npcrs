name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Use OpenSSL 3 on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install openssl@3
          {
            echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)"
            echo "OPENSSL_LIB_DIR=$(brew --prefix openssl@3)/lib"
            echo "OPENSSL_INCLUDE_DIR=$(brew --prefix openssl@3)/include"
          } >> "$GITHUB_ENV"

      - run: cargo build --lib
      - run: cargo test
      - run: cargo clippy -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
